<style>
/* Layout: coluna única de celular (máx. 640px), topo com logo, busca grande, cartões em grade 2 colunas, botões-pílula terracota */
:root{
  --creme:#EEF2F7; --papel:#FFFFFF; --linha:#E2E8F0;
  --terra:#F26A10; --terra-forte:#DB5A05; --terra-txt:#13213F;
  --agua:#1BA3E0; --agua-claro:#E3F3FC; --folha:#16A34A; --areia:#F5A524;
  --txt:#13213F; --txt-2:#64748B; --branco:#FFFFFF; --campo:#F7F9FC; --verde-cl:#EDFBF2; --verde-bd:#BDEFCD; --verde-tx:#15803D;
  --f-titulo:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-texto:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --creme:#0D1526; --papel:#16213A; --linha:#283753;
  --terra:#F7802F; --terra-forte:#FF9550; --terra-txt:#EAF0FA;
  --agua:#4DB9EC; --agua-claro:#14304A; --folha:#4ADE80; --areia:#F5B54A;
  --txt:#EAF0FA; --txt-2:#9AABC4; --branco:#FFFFFF; --campo:#101A2E; --verde-cl:#10291C; --verde-bd:#1F5A36; --verde-tx:#6EE7A0; color-scheme:dark}}
:root[data-theme="dark"]{
  --creme:#0D1526; --papel:#16213A; --linha:#283753;
  --terra:#F7802F; --terra-forte:#FF9550; --terra-txt:#EAF0FA;
  --agua:#4DB9EC; --agua-claro:#14304A; --folha:#4ADE80; --areia:#F5B54A;
  --txt:#EAF0FA; --txt-2:#9AABC4; --branco:#FFFFFF; --campo:#101A2E; --verde-cl:#10291C; --verde-bd:#1F5A36; --verde-tx:#6EE7A0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--creme);color:var(--txt);font-family:var(--f-texto);font-size:17px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-titulo);color:var(--terra-txt);margin:0;line-height:1.1;text-wrap:balance}
h2{font-size:1.5rem}
h3{font-size:1.15rem}
a{color:inherit}
.topo{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.logo{width:150px;border-radius:18px;background:#EEE2C8;padding:6px}
.topo .sub{font-family:var(--f-titulo);font-weight:700;font-size:1.05rem;color:var(--txt-2);letter-spacing:.06em;text-transform:uppercase}
.modelo{align-self:center;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--folha);border:2px solid var(--folha);border-radius:99px;padding:2px 12px}
/* busca */
.busca{position:relative;margin-top:18px}
.busca input{width:100%;font:inherit;font-size:1.15rem;padding:16px 18px 16px 54px;border-radius:99px;border:2px solid var(--terra);background:var(--papel);color:var(--txt);outline:none}
.busca input:focus{box-shadow:0 0 0 4px color-mix(in srgb,var(--terra) 25%,transparent)}
.busca svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:24px;height:24px;stroke:var(--terra);fill:none;stroke-width:2.4}
.dica{font-size:.85rem;color:var(--txt-2);margin:8px 6px 0}
.resultados{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.res{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:12px 14px}
.res:active{transform:scale(.99)}
.res .tipo{flex:none;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--branco);background:var(--terra);border-radius:99px;padding:3px 9px}
.res .tipo.prancha{background:var(--agua);color:#14313F}
.res .tipo.material{background:var(--folha)}
.res .nome{font-weight:700;min-width:0}
.res .onde{font-size:.85rem;color:var(--txt-2)}
.vazio{padding:14px;color:var(--txt-2)}
/* botões */
.pilula{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;text-decoration:none;background:var(--terra);color:var(--branco);font-family:var(--f-texto);font-weight:800;font-size:1.15rem;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:99px;padding:16px 20px;cursor:pointer}
.pilula:hover{background:var(--terra-forte)}
.pilula svg{width:26px;height:26px;fill:currentColor}
.secao{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{text-decoration:none;font-weight:800;font-size:.95rem;border-radius:99px;padding:9px 16px;border:2px solid var(--terra);color:var(--terra-txt);background:transparent;cursor:pointer;font-family:inherit}
.chip.on,.chip:hover{background:var(--terra);color:var(--branco)}
/* cartões de obra */
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.obra{display:flex;flex-direction:column;gap:2px;text-decoration:none;background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:12px 14px 14px;min-height:96px}
.obra .num{font-family:var(--f-titulo);font-weight:800;font-size:1.9rem;line-height:1;color:var(--terra)}
.obra .nm{font-weight:800;line-height:1.2}
.obra .st{margin-top:auto;font-size:.78rem;color:var(--txt-2)}
.obra.pronta{border-color:var(--terra);border-width:2px}
.obra.pronta .st{color:var(--folha);font-weight:800}
/* página de obra */
.voltar{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--terra-txt);text-decoration:none;font-size:1rem;padding:6px 0}
.cab{display:flex;gap:14px;align-items:center;margin-top:8px}
.cab .num{font-family:var(--f-titulo);font-weight:800;font-size:3.2rem;line-height:1;color:var(--branco);background:var(--terra);border-radius:20px;padding:8px 14px 2px;min-width:84px;text-align:center}
.cab h1{font-size:2rem}
.cab p{margin:2px 0 0;color:var(--txt-2)}
.indice{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
.indice a{flex:none;text-decoration:none;font-weight:800;font-size:.9rem;padding:7px 14px;border-radius:99px;background:var(--papel);border:1px solid var(--linha);color:var(--txt)}
.bloco{background:var(--papel);border:1px solid var(--linha);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:12px}
.dados{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dado{background:var(--creme);border-radius:14px;padding:10px 12px}
.dado b{display:block;font-family:var(--f-titulo);font-size:1.35rem;color:var(--terra-txt);font-variant-numeric:tabular-nums}
.dado span{font-size:.85rem;color:var(--txt-2)}
.disc{display:flex;flex-direction:column;gap:8px}
.disc-t{font-size:.8rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-2);margin-top:4px}
.pr{display:flex;align-items:center;gap:10px;border-top:1px solid var(--linha);padding-top:10px;scroll-margin-top:12px}
.pr.alvo{background:var(--agua-claro);border-radius:12px;padding:10px;border-top-color:transparent}
.pr .cod{flex:none;font-weight:800;font-variant-numeric:tabular-nums;color:var(--terra-txt);width:68px}
.pr .ds{flex:1;min-width:0;font-size:.95rem}
.pr .bt{display:flex;gap:6px;flex:none}
.mini{font:inherit;font-weight:800;font-size:.8rem;border-radius:99px;padding:6px 11px;border:0;cursor:pointer;background:var(--terra);color:var(--branco)}
.mini.cad{background:var(--agua);color:#14313F}
.tab{width:100%;border-collapse:collapse;font-size:.95rem}
.tab td{padding:9px 4px;border-top:1px solid var(--linha);vertical-align:top}
.tab td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.tab tr.alvo td{background:var(--agua-claro)}
.fotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.foto{aspect-ratio:1;max-width:100%;border-radius:14px;display:flex;align-items:flex-end;padding:8px;font-size:.75rem;font-weight:800;color:#2B2016;background:linear-gradient(160deg,var(--agua) 0 35%,var(--areia) 35% 70%,#9AAE7E 70%)}
.aviso{font-size:.85rem;color:var(--txt-2);text-align:center;margin-top:28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--txt);color:var(--creme);font-weight:700;border-radius:99px;padding:10px 18px;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
:focus-visible{outline:3px solid var(--agua);outline-offset:2px}
@media (min-width:900px){.wrap{max-width:1040px}.grade{grid-template-columns:repeat(4,minmax(0,1fr))}.gerais{grid-template-columns:repeat(3,minmax(0,1fr))!important}.topo .logo{width:180px}.busca{max-width:720px;margin-left:auto;margin-right:auto}.dica{text-align:center}.resultados{max-width:720px;margin-left:auto;margin-right:auto;width:100%}.obra-corpo{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.gerais{display:grid;grid-template-columns:1fr;gap:10px}
.geral{display:flex;align-items:center;gap:14px;text-decoration:none;background:var(--papel);border:1px solid var(--linha);border-radius:18px;padding:14px 16px}
.geral .ic{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--agua-claro);color:var(--terra-txt);font-family:var(--f-titulo);font-weight:800;font-size:1.3rem}
.geral b{display:block;font-size:1.05rem}.geral span{font-size:.85rem;color:var(--txt-2)}
.etapa{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;border-top:1px solid var(--linha);padding-top:10px}
.barra{grid-column:1/-1;height:10px;border-radius:99px;background:var(--creme);position:relative;overflow:hidden}
.barra i{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--terra)}
.mini{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style>
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--creme);display:flex;gap:6px;overflow-x:auto;padding:10px 0 8px;scrollbar-width:none}
.tabs a{flex:none;text-decoration:none;font-weight:800;font-size:.95rem;padding:9px 15px;border-radius:99px;border:2px solid var(--terra);color:var(--terra-txt)}
.tabs a.on{background:var(--terra);color:var(--branco)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--creme)}

.fam button{flex:none}
.partes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.partes a{text-decoration:none;font-size:.85rem;font-weight:700;padding:6px 11px;border-radius:99px;background:var(--papel);border:1px solid var(--linha);color:var(--txt)}
.partes a.on{background:var(--agua);border-color:var(--agua);color:#14313F}

.parte-h{display:flex;align-items:center;gap:10px}
.parte-h h3{flex:1;min-width:0}
.fam-tag{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--txt-2)}

.it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;border-top:1px solid var(--linha);padding:8px 2px;font-size:.93rem}

.st{display:inline-block;font-size:.65rem;font-weight:800;border-radius:6px;padding:0 5px;margin-left:4px;vertical-align:1px}
.st.M{background:var(--folha);color:#fff}.st.E{background:var(--areia);color:#3B2A20}
.dv{display:flex;flex-direction:column;gap:6px}
.dv-h{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.dv-h b{font-family:var(--f-titulo);color:var(--terra-txt);font-size:1.1rem}
.dv-h span{font-size:.8rem;color:var(--txt-2);font-weight:700}
.doc{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--papel);border:1px solid var(--linha);border-radius:16px;padding:8px 12px 8px 8px}
.doc img{width:84px;height:60px;object-fit:cover;object-position:right bottom;border-radius:10px;background:var(--creme);flex:none}
.it .nota{display:block;font-size:.7rem;color:var(--txt-2);font-weight:600;margin-top:2px}
.doc .cod{font-weight:800;color:var(--terra-txt);font-variant-numeric:tabular-nums}
.doc .tt{font-size:.9rem;min-width:0}
.doc .np{margin-left:auto;font-size:.78rem;color:var(--txt-2);flex:none;font-weight:700}
.pagina{background:#fff;border-radius:12px;border:1px solid var(--linha);overflow:hidden;cursor:zoom-in}
.pagina img{display:block;width:100%;height:auto}
.pg-n{font-size:.8rem;color:var(--txt-2);font-weight:700;margin:12px 4px 4px}
.zoom{position:fixed;inset:0;z-index:20;background:#1b1410;overflow:auto;-webkit-overflow-scrolling:touch}
.zoom img{display:block;width:260%;max-width:none;height:auto}
.zoom-bar{position:fixed;z-index:21;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px}
.zoom-bar button{font:inherit;font-weight:800;border:0;border-radius:99px;padding:10px 16px;background:var(--terra);color:#fff;cursor:pointer}
.fotos img{width:100%;height:100%;object-fit:cover;border-radius:14px;display:block;cursor:zoom-in}
.fotos figure{margin:0;display:flex;flex-direction:column;gap:4px}
.fotos figcaption{font-size:.75rem;color:var(--txt-2)}
.fotos{grid-template-columns:repeat(2,minmax(0,1fr))}
.fotos .ph{aspect-ratio:4/3}
.gantt{overflow-x:auto}
.gantt table{border-collapse:collapse;font-size:.78rem;min-width:720px}
.gantt td,.gantt th{padding:3px 2px;text-align:center}
.gantt th{font-weight:700;color:var(--txt-2)}
.gantt td.n{text-align:left;font-weight:700;white-space:nowrap;padding-right:8px;position:sticky;left:0;background:var(--papel)}
.gantt td.c{width:22px;height:18px}
.gantt td.c i{display:block;height:14px;border-radius:3px;background:var(--terra)}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.sel{font:inherit;font-weight:700;border-radius:99px;border:2px solid var(--terra);background:var(--papel);color:var(--txt);padding:9px 14px;max-width:100%}
.mais{font:inherit;font-weight:800;border:2px dashed var(--terra);background:transparent;color:var(--terra-txt);border-radius:99px;padding:10px;cursor:pointer}
.carregando{padding:40px 0;text-align:center;color:var(--txt-2);font-weight:700}

.voltar{color:var(--txt-2)}
.res .tipo{background:var(--terra)}
.dado{background:var(--campo);border:1px solid var(--linha)}
.dado b{color:var(--txt);font-weight:900}
.mini{background:var(--terra)}
.sel{border:1.5px solid var(--linha);background:var(--papel)}
.mais{border-color:var(--linha);color:var(--txt-2)}
.indice a{background:var(--papel)}
.disc-t{color:var(--txt-2)}
.tg{display:inline-block;font-size:.72rem;font-weight:800;border-radius:8px;padding:2px 7px;margin-top:3px}
.tg.novo{background:color-mix(in srgb,var(--folha) 14%,transparent);color:var(--verde-tx)}
.tg.tirou{background:color-mix(in srgb,#DC2626 12%,transparent);color:#B91C1C}
.trocabar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.mini.clara{background:var(--papel);color:var(--txt);border:1.5px solid var(--linha)}
.pdfic{flex:none;width:64px;height:48px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,#DC2626 12%,transparent);color:#B91C1C;font-weight:900}
.pdfview{width:100%;height:70vh;margin-top:12px;border-radius:18px;border:1px solid var(--linha);background:var(--papel)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(13,21,38,.45);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.modal .login{max-height:100%;overflow:auto}
.arq{display:block;border:2px dashed var(--linha);border-radius:20px;padding:14px;text-align:center;font-weight:800;color:var(--txt-2);cursor:pointer}
.arq input{position:absolute;opacity:0;width:1px;height:1px}
.arq:focus-within{border-color:var(--terra)}
.hrow{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--linha);padding-top:10px}
.hrow:first-child{border-top:0;padding-top:0}
.hrow b small,.hrow>small{color:var(--txt-2);font-weight:700}
.integra{background:color-mix(in srgb,var(--areia) 18%,transparent);border:1.5px solid color-mix(in srgb,var(--areia) 55%,transparent);border-radius:16px;padding:10px 12px;font-size:.9rem;font-weight:700;color:var(--txt)}
.bx{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto;border:1.5px solid var(--linha);border-radius:16px;padding:10px;background:var(--campo)}
.bx label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:start;font-size:.85rem;color:var(--txt-2)}
.bx small{font-weight:800;white-space:nowrap}
.fotos figcaption b{color:var(--txt)}
.obra.den{border:2px solid #FCA5A5;background:color-mix(in srgb,#DC2626 5%,var(--papel))}
.obra.den .num svg{width:34px;height:34px;fill:#DC2626}
.obra.den .nm{color:#B91C1C}
.cfg td:last-child{white-space:normal;font-weight:700;color:var(--txt-2)}.cfg td:first-child{font-weight:800}
/* login financeiro */
.login{max-width:440px;margin:18px auto 0;background:var(--papel);border-radius:32px;padding:30px 22px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 30px rgba(19,33,63,.07)}
.login .cad{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--terra) 12%,transparent);align-self:center}
.login .cad svg{width:32px;height:32px;fill:var(--terra)}
.login h1{text-align:center;font-size:1.8rem}
.login p{margin:-6px 0 4px;text-align:center;color:var(--txt-2);font-size:.95rem}
.users{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.users button{font:inherit;font-weight:800;font-size:1.08rem;display:flex;align-items:center;gap:10px;padding:15px 16px;border-radius:20px;border:1.5px solid var(--linha);background:var(--campo);color:var(--txt);cursor:pointer;text-align:left}
.users button i{flex:none;width:12px;height:12px;border-radius:99px}
.users button.on{border:2px solid var(--terra);background:color-mix(in srgb,var(--terra) 8%,var(--papel))}
.campo{display:flex;align-items:center;gap:12px;border:1.5px solid var(--linha);background:var(--campo);border-radius:20px;padding:4px 16px}
.campo:focus-within{border-color:var(--terra)}
.campo i{flex:none;width:11px;height:11px;border-radius:99px;background:var(--terra)}
.campo input{flex:1;min-width:0;font:inherit;font-size:1.2rem;font-weight:600;border:0;background:transparent;color:var(--txt);padding:13px 0;outline:none}
.campo button{font:inherit;font-weight:800;font-size:.95rem;border:0;background:none;color:var(--txt-2);cursor:pointer;padding:8px 2px}
</style>

const LUPA='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>';
const FAMS=["Civil","Estrutura metálica","Telhado","Fechamento","Piscina","Hidráulica","Elétrica","Esportes","Urbanização"];
let D=null, IDX=[];
const app=document.getElementById("app");
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const obra=n=>D.obras.find(o=>o[0]===n);
const brl=v=>"R$ "+Math.round(v).toLocaleString("pt-BR");
const mi=v=>"R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+" mi";
const nItens=n=>(D.mat[n]||[]).reduce((a,p)=>a+p.g.reduce((b,g)=>b+g[1].length,0),0);
const obrasDoDoc=k=>Object.keys(D.obraDocs).filter(n=>D.obraDocs[n].includes(k));
const divDe=d=>(D.div.find(x=>x[0]===d)||[d,d])[1];

function montaIndice(){
  D.obras.forEach(o=>IDX.push({t:"obra",n:o[0]+" "+o[1],w:o[2],h:"#obra-"+o[0],k:o.join(" ")+" obra "+(+o[0]),r:0}));
  Object.entries(D.docs).forEach(([k,d])=>{const ob=obrasDoDoc(k).map(n=>obra(n)[1]).join(", ");
    IDX.push({t:"prancha",n:d.c+" · "+d.t,w:ob+" · "+divDe(d.d),h:"#doc-"+k,k:d.c+" "+d.c.replace("-","")+" "+d.t+" "+ob+" "+divDe(d.d),r:1})});
  Object.entries(D.mat).forEach(([n,ps])=>ps.forEach(p=>{
    const o=obra(n); IDX.push({t:"parte",n:p.p+" · "+o[1],w:o[0]+" "+o[1]+" · lista de material",h:"#obra-"+n+"-mat-"+p.s,k:p.p+" "+p.f+" "+o[1]+" "+o[0]+" material lista compra",r:2});
    p.g.forEach(g=>g[1].forEach(it=>IDX.push({t:"material",n:it[0],w:o[0]+" "+o[1]+" · "+p.p+" · "+it[2]+" "+it[1],h:"#obra-"+n+"-mat-"+p.s,k:it[0]+" "+(it[4]||"")+" "+o[1]+" "+p.p,r:3})))}));
  IDX.forEach(x=>x.kn=norm(x.k+" "+x.n));
}
function buscar(q,lim){
  const ts=norm(q).trim().split(/\s+/).filter(Boolean); if(!ts.length) return [];
  const r=IDX.filter(x=>ts.every(t=>x.kn.includes(t)));
  const out=[],cnt=[0,0,0,0],cap=[21,12,12,lim||10];
  r.sort((a,b)=>a.r-b.r).forEach(x=>{if(cnt[x.r]<cap[x.r]){cnt[x.r]++;out.push(x)}});
  return out;
}

const MESES=["janeiro","fevereiro","marco","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESN=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const mesLongo=m=>{const i=MESES.findIndex(x=>norm(m).startsWith(x.slice(0,3)));return i<0?m:MESN[i]+" de 20"+m.slice(-2)};
const PARE=new Set("a o as os de da do das dos na no nas nos em e para pra pro com um uma uns umas que qual quais quanto quanta quantos quantas tem ter temos tenho vai vou precisa preciso me mostra mostrar ver quero saber sobre onde esta estao fica ficam eh por favor ai la isso esse essa este obra obras lista material materiais item itens metro metros metragem m quilo quilos kg peca pecas unidade unidades total como faz fazer feito sequencia metodo executar execucao deve devo pode posso dica cuidado usar usa usado vale fica ser sao foi qual quais tipo fala diz projeto".split(" "));
const ALIAS={"ginasio":"03","quadra coberta":"03","poliesportivo":"03","aquecida":"02","restaurante":"01","sede":"01","academia":"04","ondas":"06","rio lento":"07","infantis":"08","quiosque":"13","areia":"11","campo":"12","arena":"14","estacionamento":"18","trevo":"20","servicos":"15","ete":"16","eta":"16","reservatorio":"16"};
function obraDaFala(qn){
  for(const o of D.obras){const nn=norm(o[1]);if(nn.length>3&&qn.includes(nn))return o[0]}
  for(const [k,v] of Object.entries(ALIAS)) if(new RegExp("\\b"+k+"\\b").test(qn)&&obra(v)) return v;
  const m=qn.match(/\bobra (\d{1,2})\b/);if(m){const n=m[1].padStart(2,"0");if(obra(n))return n}
  return null}
const nBRq=s=>parseFloat(String(s).replace(/\./g,"").replace(",","."))||0;
const fmtQ=v=>v.toLocaleString("pt-BR",{maximumFractionDigits:1});
const naObra=n=>{const nm=obra(n)[1];return (/^(Sede|Academia|Arena|Piscina|Quadras|Área|Obras|Casas|Piscinas)/.test(nm)?(/^(Quadras|Obras|Casas|Piscinas)/.test(nm)?"nas ":"na "):"no ")+nm};
const juntar=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+" e "+a[a.length-1];
const curto=d=>d.split(" – ").filter(x=>!/^barra \d/.test(x)).slice(0,2).join(" – ").replace(/\s*\(.*?\)\s*/g," ").trim();
const unid=(q,u)=>{const m=u.match(/^barra (\d+) m$/);if(m)return (q===1?"barra":"barras")+" de "+m[1]+" m";if(u==="un")return q===1?"unidade":"unidades";if(u==="peça")return q===1?"peça":"peças";return u};
const tokens=(qn,n)=>{const on=n?norm(obra(n)[1]).split(" "):[];
  return qn.split(" ").filter(t=>t&&!PARE.has(t)&&!on.includes(t)&&!Object.keys(ALIAS).some(k=>k.split(" ").includes(t)))
    .map(t=>t.replace(/mm$/,"")).filter(Boolean).map(t=>t.length>5&&/[rlz]es$/.test(t)?t.slice(0,-2):t.length>4&&t.endsWith("s")?t.slice(0,-1):t)};
let KBN=null;
function doGuia(qn,n){if(!D.guias)return null;const ts=tokens(qn,n).filter(t=>t.length>2);if(!ts.length)return null;
  const sc=D.guias.map((g,i)=>{const k=norm(g.k+" "+g.t);let s=0;ts.forEach(t=>{if(k.includes(t))s+=t.length>5?2:1});if(n){if(g.o===n)s+=3;else if(g.o!=="00"&&!(g.o==="05"&&["05","06","07","08","02"].includes(n)))s-=3}return[s,i]}).filter(x=>x[0]>=2).sort((a,b)=>b[0]-a[0]);
  if(!sc.length)return null;const g=D.guias[sc[0][1]];const dk=g.r.split(/[ ,]/)[0].toLowerCase();
  return {t:g.x,l:[],h:D.docs[dk]?"#doc-"+dk:(g.o!=="00"?"#obra-"+g.o:"#inicio"),hl:D.docs[dk]?"Abrir a prancha "+dk.toUpperCase():"Abrir a obra",ref:"Fonte: "+g.r,kb:1}}
function doKB(qn,n){const gg=doGuia(qn,n);if(gg)return gg;if(!D.kb)return null;if(!KBN)KBN=D.kb.map(e=>norm(e[0]+" "+e[1].join(" ")));
  const ts=tokens(qn,n).filter(t=>t.length>2||/^\d/.test(t)); if(!ts.length) return null;
  const sc=D.kb.map((e,i)=>{let s=0;ts.forEach(t=>{if(KBN[i].includes(t))s+=t.length>5?2:1});if(n){if(e[2].includes(n))s+=1.5;else if(!e[2].includes("00"))s-=1}return [s,i]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]);
  const min=Math.max(2,Math.min(4,ts.length*1.2));const top=sc.filter(x=>x[0]>=min).slice(0,3);
  if(!top.length) return null;
  const es=top.map(x=>D.kb[x[1]]),ref=es[0][1][0],dk=ref.toLowerCase();
  const frase=t=>t.replace(/\s+$/,"").replace(/([^.])$/,"$1.");
  let t=`Pelo projeto (${ref}${n?", "+obra(n)[1]:""}): ${frase(es[0][0])}`;
  if(es[1]) t+=` Também está anotado${es[1][1][0]!==ref?" na "+es[1][1][0]:""}: ${frase(es[1][0])}`;
  return {t,l:es.slice(2).map(e=>e[1][0]+": "+e[0]),h:D.docs[dk]?"#doc-"+dk:"#inicio",hl:D.docs[dk]?"Abrir a prancha "+ref:"Início",kb:1}}
function responder(q){
  const qn=norm(q).replace(/[?!.,;:]/g," ").replace(/\s+/g," ").trim(); if(qn.length<3) return null;
  const n=obraDaFala(qn);
  const como=/\b(como|fundacao|montagem|montar|fixar|instalar|executa|assentar|sequencia|metodo|procedimento|deve|devo|cuidado|dica|por que|porque|qual o|qual a|pode|norma|especificacao|tipo de)\b/.test(qn);
  // mês / cronograma
  const mi=MESES.findIndex(m=>new RegExp("\\b"+m.slice(0,4)).test(qn)); const an=(qn.match(/20(27|28)/)||[])[1];
  if(mi>=0||/cronograma|previsto|quando|prazo|comeca|termina|entrega/.test(qn)){
    const lin=n?(D.linha[n]||[]):null;
    if(mi>=0){const idx=D.meses.map((m,i)=>i).filter(i=>norm(D.meses[i]).startsWith(MESES[mi].slice(0,3)));
      const ix=idx.find(i=>!an||D.meses[i].endsWith(an))??idx[0]; if(ix==null) return null;
      const at=D.crono.filter(c=>c[1][ix]&&(!lin||lin.includes(c[0]))).map(c=>c[0]);
      const ml=mesLongo(D.meses[ix]);
      const t=!at.length?`Em ${ml} não tem nada previsto${n?" "+naObra(n):""} no cronograma.`:
        n?`Em ${ml} ${naObra(n)} está previsto: ${juntar(at)}.`:`Em ${ml} o cronograma tem ${at.length} frente${at.length>1?"s":""} trabalhando ao mesmo tempo: ${juntar(at.slice(0,6))}${at.length>6?` e mais ${at.length-6}`:""}.`;
      return {t,l:at.length>6?at.slice(6):[],h:"#mes",hl:"Abrir o cronograma do mês"}}
    if(lin&&lin.length){const l=lin.map(nm=>{const c=D.crono.find(x=>x[0]===nm);if(!c)return null;const a=c[1].indexOf(1),b=c[1].lastIndexOf(1);return a<0?null:[nm,mesLongo(D.meses[a]),mesLongo(D.meses[b])]}).filter(Boolean);
      if(l.length){const t=l.length===1?`${l[0][0]} está prevista de ${l[0][1]} a ${l[0][2]}.`:`${naObra(n).replace(/^\w/,c=>c.toUpperCase())} o cronograma tem ${l.length} frentes: `+juntar(l.map(x=>`${x[0]} (${x[1]} a ${x[2]})`))+".";
        return {t,h:"#cronograma",hl:"Abrir o cronograma geral"}}}
  }
  // pranchas
  if(/prancha|planta|desenho|pdf|documento/.test(qn)&&n&&!como){const ds=(D.obraDocs[n]||[]).map(k=>D.docs[k]).filter(Boolean);
    const ex=ds.slice(0,2).map(d=>`a ${d.c} (${d.t.split(" - ").pop().toLowerCase()})`);
    return {t:ds.length?`${naObra(n).replace(/^\w/,c=>c.toUpperCase())} tem ${ds.length} prancha${ds.length>1?"s":""} no guia, como ${juntar(ex)}. Toque abaixo para ver todas.`:`Ainda não tem prancha ${naObra(n)} no guia.`,h:"#obra-"+n+"-docs",hl:"Abrir projeto e documentos"}}
  if(como){const k=doKB(qn,n);if(k)return k}
  // material
  const ts=tokens(qn,n).map(t=>/^\d+$/.test(t)&&+t<60?t+",":t);
  if(!ts.length&&n){const r=(D.resumo[n]||[]),o=obra(n);return {t:`${o[1]} (${o[2]}): ${r.slice(0,2).map(x=>x.replace(/\.$/,"")).join(". ")}${r.length?".":""} No guia tem ${nItens(n)} itens na lista e ${(D.obraDocs[n]||[]).length} pranchas dessa obra.`,h:"#obra-"+n,hl:"Abrir a obra"}}
  if(!ts.length) return null;
  const acha=amplo=>{const its=[];Object.entries(D.mat).forEach(([o,ps])=>{if(n&&o!==n)return;ps.forEach(p=>p.g.forEach(g=>g[1].forEach(it=>{const k=norm(it[0]+" "+(it[4]||"")+(amplo?" "+p.p+" "+g[0]:""));if(ts.every(t=>k.includes(t.replace(/,$/,"")))&&(!ts.some(t=>t.endsWith(","))||ts.filter(t=>t.endsWith(",")).every(t=>norm(it[0]).match(new RegExp("ø ?"+t.slice(0,-1)+"(,|\\b| )")))))its.push([o,p,it])})))});return its};
  let its=acha(false);if(!its.length)its=acha(true);
  if(!its.length){const k=doKB(qn,n);return k||(como?{t:`Procurei nas pranchas e nas listas${n?" "+naObra(n):""} e isso não está definido no projeto que está no guia.`,h:n?"#obra-"+n+"-docs":"#inicio",hl:n?"Ver as pranchas da obra":"Início"}:null)}
  const us=[...new Set(its.map(x=>x[2][1]))],nomes=[...new Set(its.map(x=>curto(x[2][0])))];
  const det=its.slice(0,10).map(([o,p,it])=>`${fmtQ(nBRq(it[2]))} ${it[1]} · ${it[0]} · ${n?p.p:obra(o)[1]}`);
  let t;
  if(us.length===1){const tot=its.reduce((a,x)=>a+nBRq(x[2][2]),0);
    const porP={};its.forEach(([o,p,it])=>{const k=n?p.p:obra(o)[1];porP[k]=(porP[k]||0)+nBRq(it[2])});const ps=Object.entries(porP).sort((a,b)=>b[1]-a[1]);
    t=`${n?naObra(n).replace(/^\w/,c=>c.toUpperCase())+" são":"No total são"} ${fmtQ(tot)} ${unid(tot,us[0])}${nomes.length===1?" de "+nomes[0].charAt(0).toLowerCase()+nomes[0].slice(1):""}.`;
    const lw=x=>n?x.toLowerCase():x;
    if(ps.length===2)t+=` Desse total, ${fmtQ(ps[0][1])} vão para ${lw(ps[0][0])} e ${fmtQ(ps[1][1])} para ${lw(ps[1][0])}.`;
    else if(ps.length>2)t+=` A maior parte, ${fmtQ(ps[0][1])}, vai para ${lw(ps[0][0])}; o resto se divide em mais ${ps.length-1} ${n?"partes":"obras"}.`;
    if(nomes.length>1&&its.length<=4)t+=` São ${juntar(its.map(([o,p,it])=>{const d=it[0].split(" – ")[0].split(",")[0];return fmtQ(nBRq(it[2]))+" de "+d.charAt(0).toLowerCase()+d.slice(1)}))}.`;
    const nt=its.map(x=>x[2][5]).find(x=>x&&/kg\/(barra|peça|painel)/.test(x));if(nt&&nomes.length===1)t+=` Para conferir o peso: ${nt.split(" · ")[0].replace("Gerdau: ","")}.`}
  else{t=`Achei ${its.length} itens ${naObra(n||its[0][0])==="" ?"":""}${n?naObra(n):"em "+new Set(its.map(x=>x[0])).size+" obras"} que batem com a pergunta. Os principais são ${juntar(its.slice(0,3).map(([o,p,it])=>`${curto(it[0]).charAt(0).toLowerCase()+curto(it[0]).slice(1)} (${fmtQ(nBRq(it[2]))} ${it[1]})`))}.`}
  return {t,l:det,mais:its.length>10?its.length-10:0,h:"#obra-"+(n||its[0][0])+"-mat-"+its[0][1].s,hl:"Abrir na lista de material"}}
const cardResp=(r,voz)=>r?`<div class="resp"><span class="rtag">${voz?"Resposta por voz":"Resposta"}</span><p>${esc(r.t)}</p>${r.l&&r.l.length?`<details><summary>${r.kb?"Mais anotações do projeto":"Ver os itens ("+(r.l.length+(r.mais||0))+")"}</summary><ul>${r.l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>${r.mais?`<p class="rmais">e mais ${r.mais}…</p>`:""}</details>`:""}<a class="rlink" href="${r.h}">${esc(r.hl)} ›</a><span class="rnota">${r.ref?esc(r.ref)+" · ":""}Resposta tirada só do que está no guia desta obra.</span></div>`:"";
let REC=null;
function ouvir(q,onFim){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=document.getElementById("mic");
  if(!SR){q.focus();toast("Neste aparelho, toque no microfone do teclado para falar.");return}
  if(REC){REC.stop();return}
  try{REC=new SR()}catch(_){q.focus();toast("Use o microfone do teclado para falar.");return}
  REC.lang="pt-BR";REC.interimResults=true;REC.maxAlternatives=1;b.classList.add("on");q.placeholder="Ouvindo… fale a pergunta";
  let fim="";REC.onresult=e=>{let t="";for(const r of e.results)t+=r[0].transcript;q.value=t;fim=t;q.dispatchEvent(new Event("input"))};
  REC.onerror=e=>{toast(e.error==="not-allowed"||e.error==="service-not-allowed"?"Microfone bloqueado. Libere o microfone ou use o do teclado.":e.error==="network"?"O reconhecimento de voz precisa de internet. Use o microfone do teclado.":"Não entendi. Tente de novo.")};
  REC.onend=()=>{b.classList.remove("on");q.placeholder="Buscar ou perguntar sobre a obra";REC=null;if(fim)onFim(fim)};
  REC.start()}
function falar(r){try{if(!r||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(r.t.replace(/Ø/g,"diâmetro ").replace(/ x /g," por "));u.lang="pt-BR";speechSynthesis.cancel();speechSynthesis.speak(u)}catch(_){}}
const linhaRes=x=>`<a class="res" href="${x.h}"><span class="tipo ${x.t==="prancha"?"prancha":x.t==="material"||x.t==="parte"?"material":""}">${x.t}</span><span style="min-width:0"><span class="nome">${esc(x.n)}</span><br><span class="onde">${esc(x.w)}</span></span></a>`;

    return `<a class="obra" href="#obra-${o[0]}"><span class="num">${o[0]}</span><span class="nm">${o[1]}</span><span class="st" style="color:var(--txt-2);font-weight:700">${nd} doc. · ${ni} itens</span></a>`}).join("")}</div></div>
  <p class="aviso">Aplicativo instalado: funciona sem internet. ${totPg} páginas de projeto e ${totItens.toLocaleString("pt-BR")} itens de material. Base: 14–15/11/2026.</p>`;

function cabObra(o,tab){

  <div class="cab"><span class="num">${o[0]}</span><div><h1>${o[1]}</h1><p>${o[2]}</p></div></div>
  <nav class="tabs">${T.map(t=>`<a href="#obra-${o[0]}${t[0]}" class="${t[0]===tab?"on":""}">${t[1]}</a>`).join("")}</nav>`;
}
function obraResumo(n){
  const o=obra(n), ps=D.mat[n]||[], docs=D.obraDocs[n]||[], linhas=D.linha[n]||[];
  const cr=D.crono.filter(c=>linhas.includes(c[0]));
  const per=cr.map(c=>{const i=c[1].indexOf(1),j=c[1].lastIndexOf(1);return i<0?"":D.meses[i]+" a "+D.meses[j]}).filter(Boolean);
  const famCount={};ps.forEach(p=>famCount[p.f]=(famCount[p.f]||0)+p.g.reduce((a,g)=>a+g[1].length,0));
  app.innerHTML=cabObra(o,"")+`

function calc(){

    cil:{n:"Estaca, tubulão, pilar redondo",c:[["d","Diâmetro"],["a","Altura ou profundidade"]],f:"3,1416 × (D ÷ 2) × (D ÷ 2) × A"},

  let tipo="caixa";
  app.innerHTML=`<a class="voltar" href="#inicio">← Início</a><h1 style="font-size:2rem;margin-top:8px">Calcular metragem cúbica</h1>

  const cx=document.getElementById("cx"),rs=document.getElementById("rs");
  const campo=(id,lb,un)=>`<div style="display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:8px;align-items:end"><label for="c-${id}" style="display:flex;flex-direction:column;gap:4px;font-weight:800">${lb}<input id="c-${id}" inputmode="decimal" placeholder="0" style="font:inherit;font-size:1.4rem;padding:12px 14px;border-radius:14px;border:2px solid var(--linha);background:var(--creme);color:var(--txt);width:100%"></label>${un?`<label for="u-${id}" hidden>Unidade</label><select id="u-${id}" class="sel" style="padding:12px 10px"><option value="1">m</option><option value="0.01">cm</option></select>`:"<span></span>"}</div>`;
  const v=id=>{const e=document.getElementById("c-"+id);let r=String(e?e.value:"").trim();if(r.includes(","))r=r.replace(/\./g,"").replace(",",".");const x=parseFloat(r)||0;const u=document.getElementById("u-"+id);return x*(u?+u.value:1)};

      if(up){reg.asset=up.id;reg.url=up.url;reg.tipo=up.contentType}else if(ant&&acao==="tirar"&&ant.url){reg.asset=ant.asset||"";reg.url=ant.url;reg.tipo=ant.tipo||""}
      bt.textContent="Salvando…";

  });
